# These are the properties to be used when creating the root ZFS pool.
# Most of these properties will be inherited by the descendant filesystems.
# The "canmount" property will not be inherited by descendant filesystems.

# pool properties (-o ...)
-o ashift=12

# filesystem properties (-O ...)
-O acltype=posix
-O canmount=off
-O compression=on
-O dnodesize=auto
-O relatime=on
-O xattr=sa
